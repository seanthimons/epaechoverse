# One API configuration file per schema; endpoint tag groups are nested inside.
# Package-wide settings; API and group filters can only narrow selection.
# Authentication keys are API-name.scheme-name; values are environment variable names.
# Never put tokens here. Share an environment variable only when explicitly intended.
config_version: 1
package: echoverse
services:
- apis/ecattaqs.yml
- apis/ecattams.yml
- apis/air.yml
- apis/echo.yml
- apis/compscreen.yml
- apis/cwa.yml
- apis/dfr.yml
- apis/eff.yml
- apis/ecattems.yml
- apis/case.yml
- apis/nncr.yml
- apis/rcra.yml
- apis/sdw.yml
- apis/wplt.yml
- apis/caa.yml
- apis/biosolids.yml
- apis/lookup.yml
- apis/cwa_viotrack.yml
- apis/rcra_viotrack.yml
- apis/air_viotrack.yml
- apis/ecatt_nif.yml
- apis/dfr_demographics.yml
- apis/micro.yml
- apis/pipeline.yml
- apis/caa_csv.yml
- apis/envirofacts.yml
- apis/arcgis_facilities.yml
- apis/arcgis_stormwater.yml
- apis/arcgis_monitor_check2.yml
- apis/arcgis_monitor_checks.yml
- apis/arcgis_sample_cities.yml
- apis/arcgis_wqi.yml
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: []
helper: api_request
documentation: yes
defaults:
  implementation: generated
  # ECHO's POST routes are read-only searches, so retrying them is safe. 60 s covers
  # slow searches; downloads and large result pages can take longer.
  request_controls:
    timeout: 60
    max_retries: 2
    retry_writes: yes
    retry_policy: echo_retry_policy
  response_policy: echo_response_policy
  batch:
    max_items: ~
    max_bytes: ~
callback_files:
- dev/callbacks.R
authentication:
  arcgis_facilities.arcgis_token: ECHOVERSE_ARCGIS_FACILITIES_ARCGIS_TOKEN
  arcgis_stormwater.arcgis_token: ECHOVERSE_ARCGIS_STORMWATER_ARCGIS_TOKEN
  arcgis_monitor_check2.arcgis_token: ECHOVERSE_ARCGIS_MONITOR_CHECK2_ARCGIS_TOKEN
  arcgis_monitor_checks.arcgis_token: ECHOVERSE_ARCGIS_MONITOR_CHECKS_ARCGIS_TOKEN
  arcgis_sample_cities.arcgis_token: ECHOVERSE_ARCGIS_SAMPLE_CITIES_ARCGIS_TOKEN
  arcgis_wqi.arcgis_token: ECHOVERSE_ARCGIS_WQI_ARCGIS_TOKEN
