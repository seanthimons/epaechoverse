# One file per API. Tag groups below control naming and R-file layout.
# selection: shared method limits and path exclusions for this API only.
# Package limits still apply; groups can only narrow selection further.
# schemas.exclude filters filenames; selection.exclude filters endpoint paths.
# helper/authentication/defaults are inherited by every group.
# Under groups, edit names and defaults.file; keep excluded include/name entries.
# Group selection.exclude is for additional restrictions, not copies of API policy.
# Group defaults and operation overrides take precedence over API defaults.
# defaults: {} inherits project settings; add batch limits here to override them.
# documentation: true # Optional API override; otherwise inherit the project.
# Never put credential tokens here; authentication values reference project keys.
api: sdw
schemas:
  files:
  - schema/sdw.json
  patterns: []
  exclude: []
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: []
helper: sdw_request
authentication: {}
defaults: {}
groups:
  sdw_metadata:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /sdw_rest_services.metadata
      - POST /sdw_rest_services.metadata
    names:
      GET /sdw_rest_services.metadata: sdw_metadata
      POST /sdw_rest_services.metadata: sdw_metadata_post
    defaults:
      file: R/sdw_metadata.R
      docs:
        tags:
          family: Metadata endpoints
    operations: {}
  sdw_safe_drinking_water:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /sdw_rest_services.get_download
      - POST /sdw_rest_services.get_download
      - GET /sdw_rest_services.get_qid
      - POST /sdw_rest_services.get_qid
      - GET /sdw_rest_services.get_systems
      - POST /sdw_rest_services.get_systems
    names:
      GET /sdw_rest_services.get_download: sdw_get_download
      POST /sdw_rest_services.get_download: sdw_get_download_post
      GET /sdw_rest_services.get_qid: sdw_get_qid
      POST /sdw_rest_services.get_qid: sdw_get_qid_post
      GET /sdw_rest_services.get_systems: sdw_get_systems
      POST /sdw_rest_services.get_systems: sdw_get_systems_post
    defaults:
      file: R/sdw_safe_drinking_water.R
      docs:
        tags:
          family: Safe Drinking Water endpoints
    operations: {}
