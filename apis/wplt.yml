# One file per API. Tag groups below control naming and R-file layout.
# selection: shared method limits and path exclusions for this API only.
# Package limits still apply; groups can only narrow selection further.
# schemas.exclude filters filenames; selection.exclude filters endpoint paths.
# helper/authentication/defaults are inherited by every group.
# Under groups, edit names and defaults.file; keep excluded include/name entries.
# Group selection.exclude is for additional restrictions, not copies of API policy.
# Group defaults and operation overrides take precedence over API defaults.
# defaults: {} inherits project settings; add batch limits here to override them.
# documentation: true # Optional API override; otherwise inherit the project.
# Never put credential tokens here; authentication values reference project keys.
api: wplt
schemas:
  files:
  - schema/wplt.json
  patterns: []
  exclude: []
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: []
helper: wplt_request
authentication: {}
defaults: {}
groups:
  wplt_custom_search:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /dmr_rest_services.get_custom_data_annual
      - POST /dmr_rest_services.get_custom_data_annual
      - GET /dmr_rest_services.get_custom_data_facility
      - POST /dmr_rest_services.get_custom_data_facility
      - GET /dmr_rest_services.get_custom_data_monitor_pd
      - POST /dmr_rest_services.get_custom_data_monitor_pd
    names:
      GET /dmr_rest_services.get_custom_data_annual: wplt_get_custom_data_annual
      POST /dmr_rest_services.get_custom_data_annual: wplt_get_custom_data_annual_post
      GET /dmr_rest_services.get_custom_data_facility: wplt_get_custom_data_facility
      POST /dmr_rest_services.get_custom_data_facility: wplt_get_custom_data_facility_post
      GET /dmr_rest_services.get_custom_data_monitor_pd: wplt_get_custom_data_monitor_pd
      POST /dmr_rest_services.get_custom_data_monitor_pd: wplt_get_custom_data_monitor_pd_post
    defaults:
      file: R/wplt_custom_search.R
      docs:
        tags:
          family: Custom Search endpoints
    operations:
      GET /dmr_rest_services.get_custom_data_annual:
        docs:
          return: "A tibble of the records (all text columns, blank values NA; the summary fields are in attr(, 'summary')) (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return the records as a tibble of text columns. FALSE returns the decoded response. Non-JSON output formats are always returned as sent."}
        result_formatter: echo_tidy_report_results
      GET /dmr_rest_services.get_custom_data_facility:
        docs:
          return: "A tibble of the records (all text columns, blank values NA; the summary fields are in attr(, 'summary')) (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return the records as a tibble of text columns. FALSE returns the decoded response. Non-JSON output formats are always returned as sent."}
        result_formatter: echo_tidy_report_results
      GET /dmr_rest_services.get_custom_data_monitor_pd:
        docs:
          return: "A tibble of the records (all text columns, blank values NA; the summary fields are in attr(, 'summary')) (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return the records as a tibble of text columns. FALSE returns the decoded response. Non-JSON output formats are always returned as sent."}
        result_formatter: echo_tidy_report_results
      POST /dmr_rest_services.get_custom_data_annual:
        docs:
          return: "A tibble of the records (all text columns, blank values NA; the summary fields are in attr(, 'summary')) (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE)."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return the records as a tibble of text columns. FALSE returns the decoded response. Non-JSON output formats are always returned as sent."}
        result_formatter: echo_tidy_report_results
      POST /dmr_rest_services.get_custom_data_facility:
        docs:
          return: "A tibble of the records (all text columns, blank values NA; the summary fields are in attr(, 'summary')) (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE)."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return the records as a tibble of text columns. FALSE returns the decoded response. Non-JSON output formats are always returned as sent."}
        result_formatter: echo_tidy_report_results
      POST /dmr_rest_services.get_custom_data_monitor_pd:
        docs:
          return: "A tibble of the records (all text columns, blank values NA; the summary fields are in attr(, 'summary')) (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE)."
        parameter_order: [body]
