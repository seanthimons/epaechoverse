              Missing coordinates yield empty geometries.'
        request:
          arguments:
            method:
              value: POST
            path:
              value: /caa_poll_rpt_rest_services.get_map
            path_params:
              callback: map_empty
            query:
              callback: map_query
            body:
              callback: map_body
            form_schema:
              callback: map_form_schema
            body_encoding:
              callback: map_body_encoding
            body_media:
              value: application/x-www-form-urlencoded
            request_controls:
              value:
                timeout: 60
                max_retries: 2
                retry_writes: yes
                retry_policy: echo_retry_policy
            response_policy:
              callback: map_policy
        parameter_order:
          - body
      GET /caa_poll_rpt_rest_services.get_spatial_metadata:
        docs:
          return: A provenance tibble (format = "tidy") or decoded response (format = "raw").
        extra_parameters:
          format:
            type: string
            default: tidy
            description: 'Client result format: tidy or raw. Coordinate provenance is not
              converted to geometry.'
        request:
          arguments:
            method:
              value: GET
            path:
              value: /caa_poll_rpt_rest_services.get_spatial_metadata
            path_params:
              callback: map_empty
            query:
              callback: map_query
            body:
              callback: map_body
            form_schema:
              callback: map_form_schema
            body_encoding:
              callback: map_body_encoding
            body_media:
              value: application/json
            request_controls:
              value:
                timeout: 60
                max_retries: 2
                retry_writes: yes
                retry_policy: echo_retry_policy
            response_policy:
              callback: map_policy
      POST /caa_poll_rpt_rest_services.get_spatial_metadata:
        docs:
          return: A provenance tibble (format = "tidy") or decoded response (format = "raw").
        extra_parameters:
          format:
            type: string
            default: tidy
            description: 'Client result format: tidy or raw. Coordinate provenance is not
              converted to geometry.'
        request:
          arguments:
