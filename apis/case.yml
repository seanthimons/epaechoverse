# One file per API. Tag groups below control naming and R-file layout.
# selection: shared method limits and path exclusions for this API only.
# Package limits still apply; groups can only narrow selection further.
# schemas.exclude filters filenames; selection.exclude filters endpoint paths.
# helper/authentication/defaults are inherited by every group.
# Under groups, edit names and defaults.file; keep excluded include/name entries.
# Group selection.exclude is for additional restrictions, not copies of API policy.
# Group defaults and operation overrides take precedence over API defaults.
# defaults: {} inherits project settings; add batch limits here to override them.
# documentation: true # Optional API override; otherwise inherit the project.
# Never put credential tokens here; authentication values reference project keys.
api: case
schemas:
  files:
  - schema/case.json
  patterns: []
  exclude: []
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: ['^/rest_lookups[.](icis_law_sections)$']
helper: case_request
authentication: {}
defaults: {}
groups:
  case_case_enforcement:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /case_rest_services.get_case_info
      - POST /case_rest_services.get_case_info
      - GET /case_rest_services.get_case_report
      - POST /case_rest_services.get_case_report
      - GET /case_rest_services.get_cases
      - POST /case_rest_services.get_cases
      - GET /case_rest_services.get_cases_from_facility
      - POST /case_rest_services.get_cases_from_facility
      - GET /case_rest_services.get_crcase_report
      - POST /case_rest_services.get_crcase_report
      - GET /case_rest_services.get_download
      - POST /case_rest_services.get_download
      - GET /case_rest_services.get_facilities_from_case
      - POST /case_rest_services.get_facilities_from_case
      - GET /case_rest_services.get_map
      - POST /case_rest_services.get_map
      - GET /case_rest_services.get_qid
      - POST /case_rest_services.get_qid
    names:
      GET /case_rest_services.get_case_info: case_get_case_info
      POST /case_rest_services.get_case_info: case_get_case_info_post
      GET /case_rest_services.get_case_report: case_get_case_report
      POST /case_rest_services.get_case_report: case_get_case_report_post
      GET /case_rest_services.get_cases: case_get_cases
      POST /case_rest_services.get_cases: case_get_cases_post
      GET /case_rest_services.get_cases_from_facility: case_get_cases_from_facility
      POST /case_rest_services.get_cases_from_facility: case_get_cases_from_facility_post
      GET /case_rest_services.get_crcase_report: case_get_crcase_report
      POST /case_rest_services.get_crcase_report: case_get_crcase_report_post
      GET /case_rest_services.get_download: case_get_download
      POST /case_rest_services.get_download: case_get_download_post
      GET /case_rest_services.get_facilities_from_case: case_get_facilities_from_case
      POST /case_rest_services.get_facilities_from_case: case_get_facilities_from_case_post
      GET /case_rest_services.get_map: case_get_map
      POST /case_rest_services.get_map: case_get_map_post
      GET /case_rest_services.get_qid: case_get_qid
      POST /case_rest_services.get_qid: case_get_qid_post
    defaults:
      file: R/case_case_enforcement.R
      docs:
        tags:
          family: Case Enforcement endpoints
    operations:
      GET /case_rest_services.get_case_info:
        docs:
          return: "A tibble of the matching rows, typed from ECHO metadata, with the query summary, query ID and query parameters in attributes (tidy = TRUE, the default for JSON output), or the decoded response (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_info_case
      GET /case_rest_services.get_cases:
        docs:
          return: "A one-row tibble of the query summary (counters as numbers, QueryID as text; with tablelist = 'Y' the first page of rows is in attr(, 'facilities')), or the decoded response (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_summary_case
      GET /case_rest_services.get_download:
        docs:
          return: "A tibble of the query rows read from the CSV, typed like the get_qid pages (tidy = TRUE, the default for the CSV output) or the CSV text as sent (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata like get_qid: numbers, dates and text; codes and IDs stay text). FALSE returns the CSV text as sent."}
        result_formatter: echo_tidy_download_case
      GET /case_rest_services.get_qid:
        docs:
          return: "A tibble of one page of records, typed from ECHO metadata (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE). Use echo_qid_all() for every page."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_qid_case
      POST /case_rest_services.get_case_info:
        docs:
          return: "A tibble of the matching rows, typed from ECHO metadata, with the query summary, query ID and query parameters in attributes (tidy = TRUE, the default for JSON output), or the decoded response (tidy = FALSE)."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_info_case
      POST /case_rest_services.get_cases:
        docs:
          return: "A one-row tibble of the query summary (counters as numbers, QueryID as text; with tablelist = 'Y' the first page of rows is in attr(, 'facilities')), or the decoded response (tidy = FALSE)."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_summary_case
      POST /case_rest_services.get_download:
        docs:
          return: "A tibble of the query rows read from the CSV, typed like the get_qid pages (tidy = TRUE, the default for the CSV output) or the CSV text as sent (tidy = FALSE)."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata like get_qid: numbers, dates and text; codes and IDs stay text). FALSE returns the CSV text as sent."}
        result_formatter: echo_tidy_download_case
      POST /case_rest_services.get_qid:
        docs:
          return: "A tibble of one page of records, typed from ECHO metadata (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE). Use echo_qid_all() for every page."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_qid_case
      GET /case_rest_services.get_map:
        docs:
          return: A map tibble, sf points, GeoJSON FeatureCollection string, or decoded
            response, selected by format. Map coordinates use EPSG:4326; clusters are representative
            points.
        extra_parameters:
          format:
            type: string
            default: tidy
            description: 'Client result format: tidy (default), sf (optional sf package),
              geojson (string), or raw. Formatted output requires JSON. Metadata is retained
              in the map attribute (GeoJSON: echo member); .layer distinguishes record arrays.
              Missing coordinates yield empty geometries.'
        request:
          arguments:
            method:
              value: GET
            path:
              value: /case_rest_services.get_map
            path_params:
              callback: map_empty
            query:
              callback: map_query
            body:
              callback: map_body
            form_schema:
              callback: map_form_schema
            body_encoding:
              callback: map_body_encoding
            body_media:
              value: application/json
            request_controls:
              value:
                timeout: 60
                max_retries: 2
                retry_writes: yes
                retry_policy: echo_retry_policy
            response_policy:
              callback: map_policy
      POST /case_rest_services.get_map:
        docs:
          return: A map tibble, sf points, GeoJSON FeatureCollection string, or decoded
            response, selected by format. Map coordinates use EPSG:4326; clusters are representative
            points.
        extra_parameters:
          format:
            type: string
            default: tidy
            description: 'Client result format: tidy (default), sf (optional sf package),
              geojson (string), or raw. Formatted output requires JSON. Metadata is retained
              in the map attribute (GeoJSON: echo member); .layer distinguishes record arrays.
              Missing coordinates yield empty geometries.'
        request:
          arguments:
            method:
              value: POST
            path:
              value: /case_rest_services.get_map
            path_params:
              callback: map_empty
            query:
              callback: map_query
            body:
              callback: map_body
            form_schema:
              callback: map_form_schema
            body_encoding:
              callback: map_body_encoding
            body_media:
              value: application/x-www-form-urlencoded
            request_controls:
              value:
                timeout: 60
                max_retries: 2
                retry_writes: yes
                retry_policy: echo_retry_policy
            response_policy:
              callback: map_policy
        parameter_order:
          - body
  case_lookups:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /rest_lookups.icis_law_sections
      - POST /rest_lookups.icis_law_sections
    names:
      GET /rest_lookups.icis_law_sections: case_lookups_icis_law_sections
      POST /rest_lookups.icis_law_sections: case_lookups_icis_law_sections_post
    defaults:
      file: R/case_lookups.R
      docs:
        tags:
          family: Lookups endpoints
    operations: {}
  case_metadata:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /case_rest_services.metadata
      - POST /case_rest_services.metadata
    names:
      GET /case_rest_services.metadata: case_metadata
      POST /case_rest_services.metadata: case_metadata_post
    defaults:
      file: R/case_metadata.R
      docs:
        tags:
          family: Metadata endpoints
    operations: {}
