# One file per API. Tag groups below control naming and R-file layout.
# selection: shared method limits and path exclusions for this API only.
# Package limits still apply; groups can only narrow selection further.
# schemas.exclude filters filenames; selection.exclude filters endpoint paths.
# helper/authentication/defaults are inherited by every group.
# Under groups, edit names and defaults.file; keep excluded include/name entries.
# Group selection.exclude is for additional restrictions, not copies of API policy.
# Group defaults and operation overrides take precedence over API defaults.
# defaults: {} inherits project settings; add batch limits here to override them.
# documentation: true # Optional API override; otherwise inherit the project.
# Never put credential tokens here; authentication values reference project keys.
api: envirofacts
schemas:
  files:
  - schema/envirofacts.json
  patterns: []
  exclude: []
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: []
helper: envirofacts_request
authentication: {}
defaults:
  inputs:
    filter: {type: character, default: ~, description: "Conditions as column/operator/value, for example pwsid/beginsWith/RI; several are combined with and. Values may not contain a slash, backslash or percent sign, and the service rejected a value containing a dot when tested. NULL for none."}
    first: {type: integer, default: 1, minimum: 1, description: First row to return (1-based).}
    last: {type: integer, default: 100, minimum: 1, description: "Last row to return; at most options(echoverse.max_rows) = 10000 rows per call."}
    format: {type: character, default: json, description: "Output format: json or csv."}
    tidy: {type: logical, default: true, description: "Return a tibble with typed columns (the same for json and csv). FALSE returns the service response as sent: a list of records for json, a string for csv."}
  request:
    arguments:
      method: {value: GET}
      path: {callback: dmap_path}
      path_params: {object: {}}
      query: {object: {}}
      body: {value: ~}
      request_controls: {value: {timeout: 120, max_retries: 2, retry_writes: true, retry_policy: echo_retry_policy}}
      response_policy: {callback: dmap_policy}
groups:
