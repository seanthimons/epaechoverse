api: arcgis_facilities
schemas:
  files:
  - schema/arcgis_facilities.json
  patterns: []
  exclude: []
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: []
helper: arcgis_facilities_request
authentication:
  arcgis_token: arcgis_facilities.arcgis_token
defaults: {}
groups:
  arcgis_facilities_layer_0:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /0/query
    names:
      GET /0/query: arcgis_facilities_query_layer_0
    defaults:
      file: R/arcgis_facilities_layer_0.R
      docs:
        tags:
          family: layer_0 endpoints
      response_policy: arcgis_facilities_request_arcgis_response
    operations:
      GET /0/query:
        pagination:
          mode: offset
          parameter: resultOffset
          size_parameter: resultRecordCount
          page_size: 1000
          start: 0
          completed: arcgis_facilities_request_arcgis_completed
          items: arcgis_page_items
          stop_on_empty: no
        extra_parameters:
          format:
            type: string
            default: tidy
            description: 'Client result: tidy tibble (default), sf, geojson string,
              or raw. Spatial output is transformed from the reported CRS to EPSG:4326;
              tidy retains native geometry. Metadata and pagination are retained.'
        docs:
          return: A tibble, sf object in EPSG:4326, GeoJSON FeatureCollection string,
            or native response/record list, selected by format. Metadata is retained
            in the arcgis attribute and GeoJSON arcgis member.
    format: arcgis-rest
    hook_callback: arcgis_hook
    hooks:
      arcgis_facilities_query_layer_0:
        pre_request:
        - arcgis_validate_format
        post_response:
        - arcgis_post_response
        post_combine:
        - arcgis_post_combine
