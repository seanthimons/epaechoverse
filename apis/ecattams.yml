      docs:
        tags:
          family: Air Monitoring Station Hazardous Air Pollutant Report Services endpoints
    operations:
      GET /ecatt_ams_rest_services.get_rpt_map:
        docs:
          return: A map tibble, sf points, GeoJSON FeatureCollection string, or decoded
            response, selected by format. Map coordinates use EPSG:4326; clusters are representative
            points.
        extra_parameters:
          format:
            type: string
            default: tidy
            description: 'Client result format: tidy (default), sf (optional sf package),
              geojson (string), or raw. Formatted output requires JSON. Metadata is retained
              in the map attribute (GeoJSON: echo member); .layer distinguishes record arrays.
              Missing coordinates yield empty geometries.'
        request:
          arguments:
            method:
              value: GET
            path:
              value: /ecatt_ams_rest_services.get_rpt_map
            path_params:
              callback: map_empty
            query:
              callback: map_query
            body:
              callback: map_body
            form_schema:
              callback: map_form_schema
            body_encoding:
              callback: map_body_encoding
            body_media:
              value: application/json
            request_controls:
              value:
                timeout: 60
                max_retries: 2
                retry_writes: yes
                retry_policy: echo_retry_policy
            response_policy:
              callback: map_policy
      POST /ecatt_ams_rest_services.get_rpt_map:
        docs:
          return: A map tibble, sf points, GeoJSON FeatureCollection string, or decoded
            response, selected by format. Map coordinates use EPSG:4326; clusters are representative
            points.
        extra_parameters:
          format:
            type: string
            default: tidy
            description: 'Client result format: tidy (default), sf (optional sf package),
              geojson (string), or raw. Formatted output requires JSON. Metadata is retained
              in the map attribute (GeoJSON: echo member); .layer distinguishes record arrays.
              Missing coordinates yield empty geometries.'
        request:
          arguments:
            method:
              value: POST
            path:
              value: /ecatt_ams_rest_services.get_rpt_map
            path_params:
              callback: map_empty
            query:
              callback: map_query
            body:
              callback: map_body
            form_schema:
              callback: map_form_schema
            body_encoding:
              callback: map_body_encoding
            body_media:
              value: application/x-www-form-urlencoded
            request_controls:
              value:
                timeout: 60
                max_retries: 2
                retry_writes: yes
                retry_policy: echo_retry_policy
            response_policy:
              callback: map_policy
        parameter_order:
          - body
