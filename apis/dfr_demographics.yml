# One file per API. Tag groups below control naming and R-file layout.
# selection: shared method limits and path exclusions for this API only.
# Package limits still apply; groups can only narrow selection further.
# schemas.exclude filters filenames; selection.exclude filters endpoint paths.
# helper/authentication/defaults are inherited by every group.
# Under groups, edit names and defaults.file; keep excluded include/name entries.
# Group selection.exclude is for additional restrictions, not copies of API policy.
# Group defaults and operation overrides take precedence over API defaults.
# defaults: {} inherits project settings; add batch limits here to override them.
# documentation: true # Optional API override; otherwise inherit the project.
# Never put credential tokens here; authentication values reference project keys.
api: dfr_demographics
schemas:
  files:
  - schema/dfr_demographics.json
  patterns: []
  exclude: []
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: []
helper: dfr_demographics_request
authentication: {}
defaults: {}
groups:
  dfr_demographics_dfr_demographics:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /dfr_rest_services.get_acs2023x_demographics_by_id
      - POST /dfr_rest_services.get_acs2023x_demographics_by_id
      - GET /dfr_rest_services.get_demographics_by_id
      - POST /dfr_rest_services.get_demographics_by_id
    names:
      GET /dfr_rest_services.get_acs2023x_demographics_by_id: dfr_demographics_get_acs2023x_demographics_by_id
      POST /dfr_rest_services.get_acs2023x_demographics_by_id: dfr_demographics_get_acs2023x_demographics_by_id_post
      GET /dfr_rest_services.get_demographics_by_id: dfr_demographics_get_demographics_by_id
      POST /dfr_rest_services.get_demographics_by_id: dfr_demographics_get_demographics_by_id_post
    defaults:
      file: R/dfr_demographics_dfr_demographics.R
      docs:
        tags:
          family: DFR Demographics endpoints
    operations: {}
