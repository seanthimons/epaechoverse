# One file per API. Tag groups below control naming and R-file layout.
# selection: shared method limits and path exclusions for this API only.
# Package limits still apply; groups can only narrow selection further.
# schemas.exclude filters filenames; selection.exclude filters endpoint paths.
# helper/authentication/defaults are inherited by every group.
# Under groups, edit names and defaults.file; keep excluded include/name entries.
# Group selection.exclude is for additional restrictions, not copies of API policy.
# Group defaults and operation overrides take precedence over API defaults.
# defaults: {} inherits project settings; add batch limits here to override them.
# documentation: true # Optional API override; otherwise inherit the project.
# Never put credential tokens here; authentication values reference project keys.
api: air
schemas:
  files:
  - schema/air.json
  patterns: []
  exclude: []
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: []
helper: air_request
authentication: {}
defaults: {}
groups:
  air_facilities:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /air_rest_services.get_download
      - POST /air_rest_services.get_download
      - GET /air_rest_services.get_facilities
      - POST /air_rest_services.get_facilities
      - GET /air_rest_services.get_facility_info
      - POST /air_rest_services.get_facility_info
      - GET /air_rest_services.get_geojson
      - POST /air_rest_services.get_geojson
      - GET /air_rest_services.get_info_clusters
      - POST /air_rest_services.get_info_clusters
      - GET /air_rest_services.get_map
      - POST /air_rest_services.get_map
      - GET /air_rest_services.get_qid
      - POST /air_rest_services.get_qid
    names:
      GET /air_rest_services.get_download: air_get_download
      POST /air_rest_services.get_download: air_get_download_post
      GET /air_rest_services.get_facilities: air_get_facilities
      POST /air_rest_services.get_facilities: air_get_facilities_post
      GET /air_rest_services.get_facility_info: air_get_facility_info
      POST /air_rest_services.get_facility_info: air_get_facility_info_post
      GET /air_rest_services.get_geojson: air_get_geojson
      POST /air_rest_services.get_geojson: air_get_geojson_post
      GET /air_rest_services.get_info_clusters: air_get_info_clusters
      POST /air_rest_services.get_info_clusters: air_get_info_clusters_post
      GET /air_rest_services.get_map: air_get_map
      POST /air_rest_services.get_map: air_get_map_post
      GET /air_rest_services.get_qid: air_get_qid
      POST /air_rest_services.get_qid: air_get_qid_post
    defaults:
      file: R/air_facilities.R
      docs:
        tags:
          family: Facilities endpoints
    operations:
      GET /air_rest_services.get_download:
        docs:
          return: "A tibble of the query rows read from the CSV, typed like the get_qid pages (tidy = TRUE, the default for the CSV output) or the CSV text as sent (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata like get_qid: numbers, dates and text; codes and IDs stay text). FALSE returns the CSV text as sent."}
        result_formatter: echo_tidy_download_air
      GET /air_rest_services.get_facilities:
        docs:
          return: "A one-row tibble of the query summary (counters as numbers, QueryID as text; with tablelist = 'Y' the first page of rows is in attr(, 'facilities')), or the decoded response (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_summary_air
      GET /air_rest_services.get_facility_info:
        docs:
          return: "A tibble of the matching rows, typed from ECHO metadata, with the query summary, query ID and query parameters in attributes (tidy = TRUE, the default for JSON output), or the decoded response (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_info_air
      GET /air_rest_services.get_qid:
        docs:
          return: "A tibble of one page of records, typed from ECHO metadata (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE). Use echo_qid_all() for every page."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_qid_air
      POST /air_rest_services.get_download:
        docs:
          return: "A tibble of the query rows read from the CSV, typed like the get_qid pages (tidy = TRUE, the default for the CSV output) or the CSV text as sent (tidy = FALSE)."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata like get_qid: numbers, dates and text; codes and IDs stay text). FALSE returns the CSV text as sent."}
        result_formatter: echo_tidy_download_air
      POST /air_rest_services.get_facilities:
        docs:
          return: "A one-row tibble of the query summary (counters as numbers, QueryID as text; with tablelist = 'Y' the first page of rows is in attr(, 'facilities')), or the decoded response (tidy = FALSE)."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_summary_air
      POST /air_rest_services.get_facility_info:
        docs:
          return: "A tibble of the matching rows, typed from ECHO metadata, with the query summary, query ID and query parameters in attributes (tidy = TRUE, the default for JSON output), or the decoded response (tidy = FALSE)."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_info_air
      POST /air_rest_services.get_qid:
        docs:
          return: "A tibble of one page of records, typed from ECHO metadata (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE). Use echo_qid_all() for every page."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_qid_air
      GET /air_rest_services.get_map:
        docs:
          return: A map tibble, sf points, GeoJSON FeatureCollection string, or decoded
            response, selected by format. Map coordinates use EPSG:4326; clusters are representative
            points.
        extra_parameters:
          format:
            type: string
            default: tidy
            description: 'Client result format: tidy (default), sf (optional sf package),
              geojson (string), or raw. Formatted output requires JSON. Metadata is retained
              in the map attribute (GeoJSON: echo member); .layer distinguishes record arrays.
              Missing coordinates yield empty geometries.'
        request:
          arguments:
            method:
              value: GET
            path:
              value: /air_rest_services.get_map
            path_params:
              callback: map_empty
            query:
              callback: map_query
            body:
              callback: map_body
            form_schema:
              callback: map_form_schema
            body_encoding:
              callback: map_body_encoding
            body_media:
              value: application/json
            request_controls:
              value:
                timeout: 60
                max_retries: 2
                retry_writes: yes
                retry_policy: echo_retry_policy
            response_policy:
              callback: map_policy
      POST /air_rest_services.get_map:
        docs:
          return: A map tibble, sf points, GeoJSON FeatureCollection string, or decoded
            response, selected by format. Map coordinates use EPSG:4326; clusters are representative
            points.
        extra_parameters:
          format:
            type: string
            default: tidy
            description: 'Client result format: tidy (default), sf (optional sf package),
              geojson (string), or raw. Formatted output requires JSON. Metadata is retained
              in the map attribute (GeoJSON: echo member); .layer distinguishes record arrays.
              Missing coordinates yield empty geometries.'
        request:
          arguments:
            method:
              value: POST
            path:
              value: /air_rest_services.get_map
            path_params:
              callback: map_empty
            query:
              callback: map_query
            body:
              callback: map_body
            form_schema:
              callback: map_form_schema
            body_encoding:
              callback: map_body_encoding
            body_media:
              value: application/x-www-form-urlencoded
            request_controls:
              value:
                timeout: 60
                max_retries: 2
                retry_writes: yes
                retry_policy: echo_retry_policy
            response_policy:
              callback: map_policy
        parameter_order:
          - body
  air_metadata:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /air_rest_services.metadata
      - POST /air_rest_services.metadata
    names:
      GET /air_rest_services.metadata: air_metadata
      POST /air_rest_services.metadata: air_metadata_post
    defaults:
      file: R/air_metadata.R
      docs:
        tags:
          family: Metadata endpoints
    operations: {}
