api: arcgis_wqi
schemas:
  files:
  - schema/arcgis_wqi.json
  patterns: []
  exclude: []
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: []
helper: arcgis_wqi_request
authentication:
  arcgis_token: arcgis_wqi.arcgis_token
defaults: {}
groups:
  arcgis_wqi_layer_0:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /0/query
      - GET /0/queryRelatedRecords
    names:
      GET /0/query: arcgis_wqi_query_layer_0
      GET /0/queryRelatedRecords: arcgis_wqi_query_related_records_layer_0
    defaults:
      file: R/arcgis_wqi_layer_0.R
      docs:
        tags:
          family: layer_0 endpoints
      response_policy: arcgis_wqi_request_arcgis_response
    operations:
      GET /0/query:
        pagination:
          mode: offset
          parameter: resultOffset
          size_parameter: resultRecordCount
          page_size: 2000
          start: 0
          completed: arcgis_wqi_request_arcgis_completed
          items: arcgis_page_items
          stop_on_empty: no
        extra_parameters:
          format:
            type: string
            default: tidy
            description: 'Client result: tidy tibble (default), sf, geojson string,
              or raw. Spatial output is transformed from the reported CRS to EPSG:4326;
              tidy retains native geometry. Metadata and pagination are retained.'
        docs:
          return: A tibble, sf object in EPSG:4326, GeoJSON FeatureCollection string,
            or native response/record list, selected by format. Metadata is retained
            in the arcgis attribute and GeoJSON arcgis member.
      GET /0/queryRelatedRecords:
        pagination:
          mode: offset
          parameter: resultOffset
          size_parameter: resultRecordCount
          page_size: 2000
          start: 0
          completed: arcgis_wqi_request_arcgis_related_completed
          items: arcgis_page_items
          stop_on_empty: no
        extra_parameters:
