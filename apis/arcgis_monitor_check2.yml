# One file per API. Tag groups below control naming and R-file layout.
# selection: shared method limits and path exclusions for this API only.
# Package limits still apply; groups can only narrow selection further.
# schemas.exclude filters filenames; selection.exclude filters endpoint paths.
# helper/authentication/defaults are inherited by every group.
# Under groups, edit names and defaults.file; keep excluded include/name entries.
# Group selection.exclude is for additional restrictions, not copies of API policy.
# Group defaults and operation overrides take precedence over API defaults.
# defaults: {} inherits project settings; add batch limits here to override them.
# documentation: true # Optional API override; otherwise inherit the project.
# Never put credential tokens here; authentication values reference project keys.
api: arcgis_monitor_check2
schemas:
  files:
  - schema/arcgis_monitor_check2.json
  patterns: []
  exclude: []
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: []
helper: arcgis_monitor_check2_request
authentication:
  arcgis_token: arcgis_monitor_check2.arcgis_token
defaults: {}
groups:
  arcgis_monitor_check2_layer_0:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /0/query
    names:
      GET /0/query: arcgis_monitor_check2_query_layer_0
    defaults:
      file: R/arcgis_monitor_check2_layer_0.R
      docs:
        tags:
          family: layer_0 endpoints
      response_policy: arcgis_monitor_check2_request_arcgis_response
    operations: {}
    format: arcgis-rest
  arcgis_monitor_check2_service:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /identify
    names:
      GET /identify: arcgis_monitor_check2_identify
    defaults:
      file: R/arcgis_monitor_check2_service.R
      docs:
        tags:
          family: service endpoints
      response_policy: arcgis_monitor_check2_request_arcgis_response
    operations: {}
    format: arcgis-rest
