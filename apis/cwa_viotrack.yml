# One file per API. Tag groups below control naming and R-file layout.
# selection: shared method limits and path exclusions for this API only.
# Package limits still apply; groups can only narrow selection further.
# schemas.exclude filters filenames; selection.exclude filters endpoint paths.
# helper/authentication/defaults are inherited by every group.
# Under groups, edit names and defaults.file; keep excluded include/name entries.
# Group selection.exclude is for additional restrictions, not copies of API policy.
# Group defaults and operation overrides take precedence over API defaults.
# defaults: {} inherits project settings; add batch limits here to override them.
# documentation: true # Optional API override; otherwise inherit the project.
# Never put credential tokens here; authentication values reference project keys.
api: cwa_viotrack
schemas:
  files:
  - schema/cwa_viotrack.json
  patterns: []
  exclude: []
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: []
helper: cwa_viotrack_request
authentication: {}
defaults: {}
groups:
  cwa_viotrack_violation_tracker:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /cwa_viotrack_services.get_download
      - POST /cwa_viotrack_services.get_download
      - GET /cwa_viotrack_services.get_facilities
      - POST /cwa_viotrack_services.get_facilities
      - GET /cwa_viotrack_services.get_qid
      - POST /cwa_viotrack_services.get_qid
      - GET /cwa_viotrack_services.metadata
      - POST /cwa_viotrack_services.metadata
    names:
      GET /cwa_viotrack_services.get_download: cwa_viotrack_get_download
      POST /cwa_viotrack_services.get_download: cwa_viotrack_get_download_post
      GET /cwa_viotrack_services.get_facilities: cwa_viotrack_get_facilities
      POST /cwa_viotrack_services.get_facilities: cwa_viotrack_get_facilities_post
      GET /cwa_viotrack_services.get_qid: cwa_viotrack_get_qid
      POST /cwa_viotrack_services.get_qid: cwa_viotrack_get_qid_post
      GET /cwa_viotrack_services.metadata: cwa_viotrack_metadata
      POST /cwa_viotrack_services.metadata: cwa_viotrack_metadata_post
    defaults:
      file: R/cwa_viotrack_violation_tracker.R
      docs:
        tags:
          family: Violation Tracker endpoints
    operations: {}
