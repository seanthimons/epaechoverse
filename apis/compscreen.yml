# One file per API. Tag groups below control naming and R-file layout.
# selection: shared method limits and path exclusions for this API only.
# Package limits still apply; groups can only narrow selection further.
# schemas.exclude filters filenames; selection.exclude filters endpoint paths.
# helper/authentication/defaults are inherited by every group.
# Under groups, edit names and defaults.file; keep excluded include/name entries.
# Group selection.exclude is for additional restrictions, not copies of API policy.
# Group defaults and operation overrides take precedence over API defaults.
# defaults: {} inherits project settings; add batch limits here to override them.
# documentation: true # Optional API override; otherwise inherit the project.
# Never put credential tokens here; authentication values reference project keys.
api: compscreen
schemas:
  files:
  - schema/compscreen.json
  patterns: []
  exclude: []
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: []
helper: compscreen_request
authentication: {}
defaults: {}
groups:
  compscreen_corporate_compliance_screener:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /comp_screen_services.get_curr_fac_info
      - POST /comp_screen_services.get_curr_fac_info
      - GET /comp_screen_services.get_curr_fac_info_b
      - POST /comp_screen_services.get_curr_fac_info_b
      - GET /comp_screen_services.get_download
      - POST /comp_screen_services.get_download
      - GET /comp_screen_services.get_facilities
      - POST /comp_screen_services.get_facilities
      - GET /comp_screen_services.get_majors
      - POST /comp_screen_services.get_majors
      - GET /comp_screen_services.get_open_cases
      - POST /comp_screen_services.get_open_cases
      - GET /comp_screen_services.get_qid
      - POST /comp_screen_services.get_qid
      - GET /comp_screen_services.get_report
      - POST /comp_screen_services.get_report
      - GET /comp_screen_services.get_settlements
      - POST /comp_screen_services.get_settlements
      - GET /comp_screen_services.get_superfund
      - POST /comp_screen_services.get_superfund
      - GET /comp_screen_services.metadata
      - POST /comp_screen_services.metadata
    names:
      GET /comp_screen_services.get_curr_fac_info: compscreen_get_curr_fac_info
      POST /comp_screen_services.get_curr_fac_info: compscreen_get_curr_fac_info_post
      GET /comp_screen_services.get_curr_fac_info_b: compscreen_get_curr_fac_info_b
      POST /comp_screen_services.get_curr_fac_info_b: compscreen_get_curr_fac_info_b_post
      GET /comp_screen_services.get_download: compscreen_get_download
      POST /comp_screen_services.get_download: compscreen_get_download_post
      GET /comp_screen_services.get_facilities: compscreen_get_facilities
      POST /comp_screen_services.get_facilities: compscreen_get_facilities_post
      GET /comp_screen_services.get_majors: compscreen_get_majors
      POST /comp_screen_services.get_majors: compscreen_get_majors_post
      GET /comp_screen_services.get_open_cases: compscreen_get_open_cases
      POST /comp_screen_services.get_open_cases: compscreen_get_open_cases_post
      GET /comp_screen_services.get_qid: compscreen_get_qid
      POST /comp_screen_services.get_qid: compscreen_get_qid_post
      GET /comp_screen_services.get_report: compscreen_get_report
      POST /comp_screen_services.get_report: compscreen_get_report_post
      GET /comp_screen_services.get_settlements: compscreen_get_settlements
      POST /comp_screen_services.get_settlements: compscreen_get_settlements_post
      GET /comp_screen_services.get_superfund: compscreen_get_superfund
      POST /comp_screen_services.get_superfund: compscreen_get_superfund_post
      GET /comp_screen_services.metadata: compscreen_metadata
      POST /comp_screen_services.metadata: compscreen_metadata_post
    defaults:
      file: R/compscreen_corporate_compliance_screener.R
      docs:
        tags:
          family: Corporate Compliance Screener endpoints
    operations:
      GET /comp_screen_services.get_download:
        docs:
          return: "A tibble of the query rows read from the CSV, typed like the get_qid pages (tidy = TRUE, the default for the CSV output) or the CSV text as sent (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata like get_qid: numbers, dates and text; codes and IDs stay text). FALSE returns the CSV text as sent."}
        result_formatter: echo_tidy_download_compscreen
      GET /comp_screen_services.get_facilities:
        docs:
          return: "A one-row tibble of the query summary (counters as numbers, QueryID as text; with tablelist = 'Y' the first page of rows is in attr(, 'facilities')), or the decoded response (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_summary_compscreen
      GET /comp_screen_services.get_qid:
        docs:
          return: "A tibble of one page of records, typed from ECHO metadata (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE). Use echo_qid_all() for every page."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_qid_compscreen
      POST /comp_screen_services.get_download:
        docs:
          return: "A tibble of the query rows read from the CSV, typed like the get_qid pages (tidy = TRUE, the default for the CSV output) or the CSV text as sent (tidy = FALSE)."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata like get_qid: numbers, dates and text; codes and IDs stay text). FALSE returns the CSV text as sent."}
        result_formatter: echo_tidy_download_compscreen
      POST /comp_screen_services.get_facilities:
        docs:
          return: "A one-row tibble of the query summary (counters as numbers, QueryID as text; with tablelist = 'Y' the first page of rows is in attr(, 'facilities')), or the decoded response (tidy = FALSE)."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_summary_compscreen
      POST /comp_screen_services.get_qid:
        docs:
          return: "A tibble of one page of records, typed from ECHO metadata (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE). Use echo_qid_all() for every page."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_qid_compscreen
