# One file per API. Tag groups below control naming and R-file layout.
# selection: shared method limits and path exclusions for this API only.
# Package limits still apply; groups can only narrow selection further.
# schemas.exclude filters filenames; selection.exclude filters endpoint paths.
# helper/authentication/defaults are inherited by every group.
# Under groups, edit names and defaults.file; keep excluded include/name entries.
# Group selection.exclude is for additional restrictions, not copies of API policy.
# Group defaults and operation overrides take precedence over API defaults.
# defaults: {} inherits project settings; add batch limits here to override them.
# documentation: true # Optional API override; otherwise inherit the project.
# Never put credential tokens here; authentication values reference project keys.
api: rcra
schemas:
  files:
  - schema/rcra.json
  patterns: []
  exclude: []
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: []
helper: rcra_request
authentication: {}
defaults: {}
groups:
  rcra_metadata:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /rcra_rest_services.metadata
      - POST /rcra_rest_services.metadata
    names:
      GET /rcra_rest_services.metadata: rcra_metadata
      POST /rcra_rest_services.metadata: rcra_metadata_post
    defaults:
      file: R/rcra_metadata.R
      docs:
        tags:
          family: Metadata endpoints
    operations: {}
  rcra_resource_conservation_and_recovery_act:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /rcra_rest_services.get_download
      - POST /rcra_rest_services.get_download
      - GET /rcra_rest_services.get_facilities
      - POST /rcra_rest_services.get_facilities
      - GET /rcra_rest_services.get_facility_info
      - POST /rcra_rest_services.get_facility_info
      - GET /rcra_rest_services.get_geojson
      - POST /rcra_rest_services.get_geojson
      - GET /rcra_rest_services.get_info_clusters
      - POST /rcra_rest_services.get_info_clusters
      - GET /rcra_rest_services.get_map
      - POST /rcra_rest_services.get_map
      - GET /rcra_rest_services.get_qid
      - POST /rcra_rest_services.get_qid
    names:
      GET /rcra_rest_services.get_download: rcra_get_download
      POST /rcra_rest_services.get_download: rcra_get_download_post
      GET /rcra_rest_services.get_facilities: rcra_get_facilities
      POST /rcra_rest_services.get_facilities: rcra_get_facilities_post
      GET /rcra_rest_services.get_facility_info: rcra_get_facility_info
      POST /rcra_rest_services.get_facility_info: rcra_get_facility_info_post
      GET /rcra_rest_services.get_geojson: rcra_get_geojson
      POST /rcra_rest_services.get_geojson: rcra_get_geojson_post
      GET /rcra_rest_services.get_info_clusters: rcra_get_info_clusters
      POST /rcra_rest_services.get_info_clusters: rcra_get_info_clusters_post
      GET /rcra_rest_services.get_map: rcra_get_map
      POST /rcra_rest_services.get_map: rcra_get_map_post
      GET /rcra_rest_services.get_qid: rcra_get_qid
      POST /rcra_rest_services.get_qid: rcra_get_qid_post
    defaults:
      file: R/rcra_resource_conservation_and_recovery_act.R
      docs:
        tags:
          family: Resource Conservation and Recovery Act endpoints
    operations: {}
