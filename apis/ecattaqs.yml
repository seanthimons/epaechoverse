      - GET /ecatt_aqs_rest_services.get_rpt_polls
      - POST /ecatt_aqs_rest_services.get_rpt_polls
      - GET /ecatt_aqs_rest_services.get_rpt_stats
      - POST /ecatt_aqs_rest_services.get_rpt_stats
      - GET /ecatt_aqs_rest_services.get_rpt_windrose
      - POST /ecatt_aqs_rest_services.get_rpt_windrose
      - GET /ecatt_aqs_rest_services.get_rpt_windrose_daily
      - POST /ecatt_aqs_rest_services.get_rpt_windrose_daily
    names:
      GET /ecatt_aqs_rest_services.get_acs2023x_demographics_by_id: ecattaqs_get_acs2023x_demographics_by_id
      POST /ecatt_aqs_rest_services.get_acs2023x_demographics_by_id: ecattaqs_get_acs2023x_demographics_by_id_post
      GET /ecatt_aqs_rest_services.get_rpt_facs: ecattaqs_get_rpt_facs
