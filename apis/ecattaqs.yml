    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /ecatt_aqs_rest_services.get_acs2023x_demographics_by_id
      - POST /ecatt_aqs_rest_services.get_acs2023x_demographics_by_id
