# One file per API. Tag groups below control naming and R-file layout.
# selection: shared method limits and path exclusions for this API only.
# Package limits still apply; groups can only narrow selection further.
# schemas.exclude filters filenames; selection.exclude filters endpoint paths.
# helper/authentication/defaults are inherited by every group.
# Under groups, edit names and defaults.file; keep excluded include/name entries.
# Group selection.exclude is for additional restrictions, not copies of API policy.
# Group defaults and operation overrides take precedence over API defaults.
# defaults: {} inherits project settings; add batch limits here to override them.
# documentation: true # Optional API override; otherwise inherit the project.
# Never put credential tokens here; authentication values reference project keys.
api: cwa
schemas:
  files:
  - schema/cwa.json
  patterns: []
  exclude: []
selection:
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - TRACE
  exclude: ['^/rest_lookups[.](bp_tribes|cwa_parameters|cwa_pollutants|federal_agencies|icis_inspection_types|icis_law_sections|naics_codes|npdes_parameters|wbd_code_lu|wbd_name_lu)$']
helper: cwa_request
authentication: {}
defaults: {}
groups:
  cwa_facility_information:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /cwa_rest_services.get_download
      - POST /cwa_rest_services.get_download
      - GET /cwa_rest_services.get_facilities
      - POST /cwa_rest_services.get_facilities
      - GET /cwa_rest_services.get_facility_info
      - POST /cwa_rest_services.get_facility_info
      - GET /cwa_rest_services.get_geojson
      - POST /cwa_rest_services.get_geojson
      - GET /cwa_rest_services.get_info_clusters
      - POST /cwa_rest_services.get_info_clusters
      - GET /cwa_rest_services.get_map
      - POST /cwa_rest_services.get_map
      - GET /cwa_rest_services.get_qid
      - POST /cwa_rest_services.get_qid
    names:
      GET /cwa_rest_services.get_download: cwa_get_download
      POST /cwa_rest_services.get_download: cwa_get_download_post
      GET /cwa_rest_services.get_facilities: cwa_get_facilities
      POST /cwa_rest_services.get_facilities: cwa_get_facilities_post
      GET /cwa_rest_services.get_facility_info: cwa_get_facility_info
      POST /cwa_rest_services.get_facility_info: cwa_get_facility_info_post
      GET /cwa_rest_services.get_geojson: cwa_get_geojson
      POST /cwa_rest_services.get_geojson: cwa_get_geojson_post
      GET /cwa_rest_services.get_info_clusters: cwa_get_info_clusters
      POST /cwa_rest_services.get_info_clusters: cwa_get_info_clusters_post
      GET /cwa_rest_services.get_map: cwa_get_map
      POST /cwa_rest_services.get_map: cwa_get_map_post
      GET /cwa_rest_services.get_qid: cwa_get_qid
      POST /cwa_rest_services.get_qid: cwa_get_qid_post
    defaults:
      file: R/cwa_facility_information.R
      docs:
        tags:
          family: Facility Information endpoints
    operations:
      GET /cwa_rest_services.get_download:
        docs:
          return: "A tibble of the query rows read from the CSV, typed like the get_qid pages (tidy = TRUE, the default for the CSV output) or the CSV text as sent (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata like get_qid: numbers, dates and text; codes and IDs stay text). FALSE returns the CSV text as sent."}
        result_formatter: echo_tidy_download_cwa
      GET /cwa_rest_services.get_facilities:
        docs:
          return: "A one-row tibble of the query summary (counters as numbers, QueryID as text; with tablelist = 'Y' the first page of rows is in attr(, 'facilities')), or the decoded response (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_summary_cwa
      GET /cwa_rest_services.get_facility_info:
        docs:
          return: "A tibble of the matching rows, typed from ECHO metadata, with the query summary, query ID and query parameters in attributes (tidy = TRUE, the default for JSON output), or the decoded response (tidy = FALSE)."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_info_cwa
      GET /cwa_rest_services.get_qid:
        docs:
          return: "A tibble of one page of records, typed from ECHO metadata (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE). Use echo_qid_all() for every page."
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_qid_cwa
      POST /cwa_rest_services.get_download:
        docs:
          return: "A tibble of the query rows read from the CSV, typed like the get_qid pages (tidy = TRUE, the default for the CSV output) or the CSV text as sent (tidy = FALSE)."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata like get_qid: numbers, dates and text; codes and IDs stay text). FALSE returns the CSV text as sent."}
        result_formatter: echo_tidy_download_cwa
      POST /cwa_rest_services.get_facilities:
        docs:
          return: "A one-row tibble of the query summary (counters as numbers, QueryID as text; with tablelist = 'Y' the first page of rows is in attr(, 'facilities')), or the decoded response (tidy = FALSE)."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_summary_cwa
      POST /cwa_rest_services.get_facility_info:
        docs:
          return: "A tibble of the matching rows, typed from ECHO metadata, with the query summary, query ID and query parameters in attributes (tidy = TRUE, the default for JSON output), or the decoded response (tidy = FALSE)."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_info_cwa
      POST /cwa_rest_services.get_qid:
        docs:
          return: "A tibble of one page of records, typed from ECHO metadata (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE). Use echo_qid_all() for every page."
        parameter_order: [body]
        extra_parameters:
          tidy: {type: logical, default: true, description: "Return a tibble (typed from ECHO metadata: numbers, dates and text; codes and IDs stay text). FALSE returns the decoded response. Non-JSON output formats and GeoJSON are always returned as sent."}
        result_formatter: echo_tidy_qid_cwa
      GET /cwa_rest_services.get_map:
        docs:
          return: A map tibble, sf points, GeoJSON FeatureCollection string, or decoded
            response, selected by format. Map coordinates use EPSG:4326; clusters are representative
            points.
        extra_parameters:
          format:
            type: string
            default: tidy
            description: 'Client result format: tidy (default), sf (optional sf package),
              geojson (string), or raw. Formatted output requires JSON. Metadata is retained
              in the map attribute (GeoJSON: echo member); .layer distinguishes record arrays.
              Missing coordinates yield empty geometries.'
        request:
          arguments:
            method:
              value: GET
            path:
              value: /cwa_rest_services.get_map
            path_params:
              callback: map_empty
            query:
              callback: map_query
            body:
              callback: map_body
            form_schema:
              callback: map_form_schema
            body_encoding:
              callback: map_body_encoding
            body_media:
              value: application/json
            request_controls:
              value:
                timeout: 60
                max_retries: 2
                retry_writes: yes
                retry_policy: echo_retry_policy
            response_policy:
              callback: map_policy
      POST /cwa_rest_services.get_map:
        docs:
          return: A map tibble, sf points, GeoJSON FeatureCollection string, or decoded
            response, selected by format. Map coordinates use EPSG:4326; clusters are representative
            points.
        extra_parameters:
          format:
            type: string
            default: tidy
            description: 'Client result format: tidy (default), sf (optional sf package),
              geojson (string), or raw. Formatted output requires JSON. Metadata is retained
              in the map attribute (GeoJSON: echo member); .layer distinguishes record arrays.
              Missing coordinates yield empty geometries.'
        request:
          arguments:
            method:
              value: POST
            path:
              value: /cwa_rest_services.get_map
            path_params:
              callback: map_empty
            query:
              callback: map_query
            body:
              callback: map_body
            form_schema:
              callback: map_form_schema
            body_encoding:
              callback: map_body_encoding
            body_media:
              value: application/x-www-form-urlencoded
            request_controls:
              value:
                timeout: 60
                max_retries: 2
                retry_writes: yes
                retry_policy: echo_retry_policy
            response_policy:
              callback: map_policy
        parameter_order:
          - body
  cwa_lookups:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /rest_lookups.bp_tribes
      - POST /rest_lookups.bp_tribes
      - GET /rest_lookups.cwa_parameters
      - POST /rest_lookups.cwa_parameters
      - GET /rest_lookups.cwa_pollutants
      - POST /rest_lookups.cwa_pollutants
      - GET /rest_lookups.federal_agencies
      - POST /rest_lookups.federal_agencies
      - GET /rest_lookups.icis_inspection_types
      - POST /rest_lookups.icis_inspection_types
      - GET /rest_lookups.icis_law_sections
      - POST /rest_lookups.icis_law_sections
      - GET /rest_lookups.msgp_years
      - POST /rest_lookups.msgp_years
      - GET /rest_lookups.naics_codes
      - POST /rest_lookups.naics_codes
      - GET /rest_lookups.npdes_parameters
      - POST /rest_lookups.npdes_parameters
      - GET /rest_lookups.wbd_code_lu
      - POST /rest_lookups.wbd_code_lu
      - GET /rest_lookups.wbd_name_lu
      - POST /rest_lookups.wbd_name_lu
    names:
      GET /rest_lookups.bp_tribes: cwa_lookups_bp_tribes
      POST /rest_lookups.bp_tribes: cwa_lookups_bp_tribes_post
      GET /rest_lookups.cwa_parameters: cwa_lookups_cwa_parameters
      POST /rest_lookups.cwa_parameters: cwa_lookups_cwa_parameters_post
      GET /rest_lookups.cwa_pollutants: cwa_lookups_cwa_pollutants
      POST /rest_lookups.cwa_pollutants: cwa_lookups_cwa_pollutants_post
      GET /rest_lookups.federal_agencies: cwa_lookups_federal_agencies
      POST /rest_lookups.federal_agencies: cwa_lookups_federal_agencies_post
      GET /rest_lookups.icis_inspection_types: cwa_lookups_icis_inspection_types
      POST /rest_lookups.icis_inspection_types: cwa_lookups_icis_inspection_types_post
      GET /rest_lookups.icis_law_sections: cwa_lookups_icis_law_sections
      POST /rest_lookups.icis_law_sections: cwa_lookups_icis_law_sections_post
      GET /rest_lookups.msgp_years: cwa_lookups_msgp_years
      POST /rest_lookups.msgp_years: cwa_lookups_msgp_years_post
      GET /rest_lookups.naics_codes: cwa_lookups_naics_codes
      POST /rest_lookups.naics_codes: cwa_lookups_naics_codes_post
      GET /rest_lookups.npdes_parameters: cwa_lookups_npdes_parameters
      POST /rest_lookups.npdes_parameters: cwa_lookups_npdes_parameters_post
      GET /rest_lookups.wbd_code_lu: cwa_lookups_wbd_code_lu
      POST /rest_lookups.wbd_code_lu: cwa_lookups_wbd_code_lu_post
      GET /rest_lookups.wbd_name_lu: cwa_lookups_wbd_name_lu
      POST /rest_lookups.wbd_name_lu: cwa_lookups_wbd_name_lu_post
    defaults:
      file: R/cwa_lookups.R
      docs:
        tags:
          family: Lookups endpoints
        return: "A tibble of text columns (tidy = TRUE, the default for JSON output) or the decoded response (tidy = FALSE)."
      extra_parameters:
        tidy: {type: logical, default: true, description: "Return a tibble of text columns (blank values are NA). FALSE returns the decoded response. Non-JSON output formats are always returned as sent."}
    operations:
      GET /rest_lookups.msgp_years:
        result_formatter: echo_tidy_lookup
      POST /rest_lookups.msgp_years:
        result_formatter: echo_tidy_lookup
  cwa_metadata:
    selection:
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS
      - TRACE
      exclude: []
      include:
      - GET /cwa_rest_services.metadata
      - POST /cwa_rest_services.metadata
    names:
      GET /cwa_rest_services.metadata: cwa_metadata
      POST /cwa_rest_services.metadata: cwa_metadata_post
    defaults:
      file: R/cwa_metadata.R
      docs:
        tags:
          family: Metadata endpoints
    operations: {}
