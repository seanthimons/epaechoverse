# Copy to .github/workflows/lint-workflows.yaml in your repo.
name: Lint workflows

on:
  push:
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']

permissions:
  contents: read

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows
    uses: seanthimons/baseline/.github/workflows/lint-workflows.yaml@f6ca03d08be881f191de2a6b41a9b72421e0a845 # v2.1.1
