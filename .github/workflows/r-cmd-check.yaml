name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r-cmd-check:
    name: R CMD check
    # Pinned to the baseline v1.4.0 commit. Dependabot bumps this.
    uses: seanthimons/baseline/.github/workflows/r-cmd-check.yaml@f6ca03d08be881f191de2a6b41a9b72421e0a845 # v2.1.1
    with:
      # Linux only. The baseline default also runs Windows and macOS.
      matrix: '[{"os":"ubuntu-latest","r":"release"}]'
