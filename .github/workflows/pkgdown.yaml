# Builds PRs and deploys main/release/manual builds via Pages artifacts.
# Repository Pages source must be GitHub Actions (already configured).
name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One group per ref. A new push to a pull request cancels its superseded build.
# Main and release runs never cancel each other (they use different refs); the
# reusable workflow's `pages` group serialises the actual deploys.
concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pkgdown:
    name: pkgdown
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pkgdown-baseline.yaml
