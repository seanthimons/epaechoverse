# Builds PRs and deploys main/release/manual builds via Pages artifacts.
# Repository Pages source must be GitHub Actions (already configured).
name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
  cancel-in-progress: true

jobs:
  pkgdown:
    name: pkgdown
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pkgdown-baseline.yaml
